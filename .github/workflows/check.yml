# Runs the validation gate without game assets: format, clippy, compiling the Rust tests, Python tests and the hygiene rules.
name: check
# Branches are checked through their pull request; pushing a work branch alone does not spend CI time.
on:
  push:
    branches: [main]
  pull_request:
concurrency: # a newer push to a PR cancels its outdated run; main runs always finish so they save the cache
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# CI builds only the dev profile and runs no game (no assets): our crate unoptimised; dependencies keep
# opt-level 3 from [profile.dev.package."*"] and come from the cache.
env:
  CARGO_PROFILE_DEV_OPT_LEVEL: 0
  CARGO_INCREMENTAL: 0
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: game
          save-if: ${{ github.ref == 'refs/heads/main' }} # PRs restore main's cache, never save their own
      - run: pip install -r requirements-dev.txt
      - run: tools/check.sh
