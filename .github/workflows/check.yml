# Runs the validation gate without game assets: format, clippy, compiling the Rust tests, Python tests and the hygiene rules.
# Lint runs first and fails fast; the Rust jobs (Linux and Windows) wait for it and are skipped for docs-only and Python-only changes.
name: check
# Branches are checked through their pull request; pushing a work branch alone does not spend CI time.
on:
  push:
    branches: [main]
  pull_request:
concurrency: # a newer push to a PR cancels its outdated run; main runs always finish so they save the cache
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# CI builds only the dev profile and runs no game (no assets): our crate unoptimised; dependencies keep
# opt-level 3 from [profile.dev.package."*"] and come from the cache.
env:
  CARGO_PROFILE_DEV_OPT_LEVEL: 0
  CARGO_INCREMENTAL: 0
jobs:
  # Which parts of the repository the change touches. Done here (not with `on.paths`) so that the jobs show up as skipped, which
  # counts as passed for required checks, instead of never reporting. Pushes to main always run everything.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      python: ${{ steps.diff.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            files=$(git ls-files)
          fi
          printf '%s\n' "$files"
          # Rust: the game, the data it ships or the example mods it tests, and the workflow itself.
          if printf '%s\n' "$files" | grep -q -E '^(game/|content/|mods/|tools/check\.sh$|\.github/|docs/rule-types\.md$|docs/modding\.md$|docs/examples/)'; then echo rust=true; else echo rust=false; fi >> "$GITHUB_OUTPUT"
          # Python: tools, tests, and everything the tests read.
          if printf '%s\n' "$files" | grep -q -E '\.py$|^(tests/|tools/|content/|mods/|requirements|ruff\.toml|\.github/)'; then echo python=true; else echo python=false; fi >> "$GITHUB_OUTPUT"

  lint: # seconds: no Rust build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: python -m unittest discover -s tests -p test_repo_hygiene.py
      - name: rustfmt (the toolchain pinned by rust-version)
        run: |
          v=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' game/Cargo.toml)
          rustup toolchain install "$v" --profile minimal --component rustfmt
          cargo +"$v" fmt --manifest-path game/Cargo.toml --check

  python-tests:
    needs: [changes, lint]
    # Rust changes run the Python tests inside tools/check.sh already.
    if: needs.changes.outputs.python == 'true' && needs.changes.outputs.rust != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests

  rust-linux:
    needs: [changes, lint]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: system packages
        # Skip when present; install without refreshing the index first (the image's index is recent), refresh only on failure.
        run: |
          pkgs="pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev"
          dpkg -s $pkgs >/dev/null 2>&1 && exit 0
          opts="-y -qq --no-install-recommends -o Dpkg::Options::=--force-unsafe-io"
          sudo apt-get install $opts $pkgs || { sudo apt-get update -qq && sudo apt-get install $opts $pkgs; }
      - name: Rust toolchain (the minimum supported, from rust-version)
        run: |
          v=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' game/Cargo.toml)
          rustup toolchain install "$v" --profile minimal --component rustfmt --component clippy
          rustup default "$v"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: game
          save-if: ${{ github.ref == 'refs/heads/main' }} # PRs restore main's cache, never save their own
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: tools/check.sh
      - name: Job summary (no game assets)
        if: always()
        run: |
          {
            echo "### Not covered: game assets"
            echo "CI has no game assets, so the asset tests, the smokes and the battle check did not run. tools/check.sh ends GATE PARTIAL here by design; a green run is not a full check. Run \`tools/check.sh --full\` locally with imported assets before pushing."
          } >> "$GITHUB_STEP_SUMMARY"

  # The Windows build must keep working (the game ships there): the same tools/check.sh as Linux (Git Bash), no smokes.
  # Tests that need a Linux shell or a display skip themselves on Windows with the reason in the skip message.
  rust-windows:
    needs: [changes, lint]
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (the minimum supported, from rust-version)
        run: |
          v=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' game/Cargo.toml)
          rustup toolchain install "$v" --profile minimal --component rustfmt --component clippy
          rustup default "$v"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: game
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: tools/check.sh
      - name: Job summary (no game assets)
        if: always()
        run: |
          {
            echo "### Not covered: game assets"
            echo "CI has no game assets, so the asset tests, the smokes and the battle check did not run. tools/check.sh ends GATE PARTIAL here by design; a green run is not a full check. Run \`tools/check.sh --full\` locally with imported assets before pushing."
          } >> "$GITHUB_STEP_SUMMARY"
