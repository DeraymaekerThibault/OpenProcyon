name: Bug report
description: Something crashes, gets stuck, or behaves differently from the original game.
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Campaign mission number, or skirmish map and ships.
      placeholder: Mission 3 / Skirmish, Red Rover, Cutter vs Barque
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what the remake did. Include the error text if it crashed.
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: What the original does
      description: If you know it, how the original game behaves in the same situation.
  - type: input
    id: version
    attributes:
      label: Version and system
      placeholder: v0.1.0, Windows 11
  - type: markdown
    attributes:
      value: Don't attach game files, or saves, videos and screenshots taken from the original game. Describe them in your own words instead (see CONTRIBUTING.md). Logs and screenshots of OpenProcyon itself are fine.
